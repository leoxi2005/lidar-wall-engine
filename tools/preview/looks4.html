<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>LiDAR Wall — DÒNG SÁNG (teamLab)</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; background:#07080c; color:#c8d4e4;
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .wrap { max-width:1500px; margin:0 auto; padding:18px 20px 40px; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.14em; color:#8fb8dd; margin:0 0 4px; }
  .sub { color:#5d6b80; margin:0 0 16px; }
  canvas { display:block; width:100%; border-radius:6px; background:#000; cursor:crosshair; touch-action:none; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 10px; }
  button { font:inherit; color:#b9c9dc; background:#131722; border:1px solid #26304a;
           padding:7px 14px; border-radius:5px; cursor:pointer; }
  button:hover { border-color:#3d5686; color:#e6f0fb; }
  button.on { background:#1d2942; border-color:#5b83c8; color:#eaf3ff; }
  .desc { color:#7e8ea6; margin:12px 0 0; max-width:80ch; }
  .desc b { color:#a9c4e2; font-weight:600; }
  #ctl { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:6px 14px;
         margin:12px 0 0; padding:10px 12px; background:#0d1119; border:1px solid #1c2436; border-radius:6px; }
  #ctl label { display:flex; align-items:center; gap:8px; font-size:11px; color:#7f92ab; }
  #ctl label span { width:96px; flex:none; }
  #ctl input { flex:1; accent-color:#5b83c8; }
  #ctl b { color:#cfe0f2; width:46px; text-align:right; font-weight:500; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LiDAR WALL — DÒNG SÁNG</h1>
  <p class="sub">Hàng nghìn hạt chảy theo dòng, mỗi hạt kéo một vệt sáng dài — đúng cách teamLab
    dựng mặt sàn nước. Giữ chuột và kéo để khuấy.</p>

  <div class="bar">
    <button data-look="0" class="on">1 · CHUẨN</button>
    <button data-look="1">2 · SỢI DÀI</button>
    <button data-look="2">3 · DÀY ĐẶC</button>
    <span style="flex:1"></span>
    <button id="viewBtn">Đang xem: 1 TƯỜNG (560×240)</button>
    <button id="clearBtn">Xoá</button>
  </div>

  <canvas id="c"></canvas>
  <div id="ctl"></div>
  <p class="desc" id="desc"></p>
</div>

<script>
const DESCS = [
 '<b>CHUẨN</b> — mật độ và độ dài vệt gần nhất với clip: sợi sáng rời nhau, thấy rõ từng dòng chảy, nền đen thật. Khuấy tay thì dòng cuộn lại thành xoáy và vệt bị kéo theo.',
 '<b>SỢI DÀI</b> — đuôi vệt sống lâu hơn, nên mỗi dòng vẽ thành đường cong dài mượt. Xoáy đọc rõ hơn, nhưng chi tiết nhỏ ít đi.',
 '<b>DÀY ĐẶC</b> — gấp đôi số hạt, vệt ngắn hơn: gần giống mặt nước dày ken như trong clip lúc quay cận sàn.'
];

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha:false, antialias:false });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
  document.body.innerHTML = '<p style="padding:40px">Trình duyệt thiếu WebGL2 hoặc float render target.</p>';
}

const ASPECT = 10350/1080, WALL = 560/240;
let viewFull = false, look = 0;

// ---------------------------------------------------------------- flow field (JS)
// The particles are advected on the CPU, so the field has to exist here as well as in the
// shader. Cheap integer hash rather than sin(): at ~10k particles this is evaluated
// hundreds of thousands of times a second and sin() alone would eat the frame.
function hash2(x, y) {
  let h = (x * 374761393 + y * 668265263) | 0;
  h = (h ^ (h >> 13)) * 1274126177 | 0;
  return ((h ^ (h >> 16)) >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return (a * (1 - u) + b * u) * (1 - v) + (c * (1 - u) + d * u) * v;
}
// Lower frequency and a slower clock: big lazy currents instead of busy little ones. The
// second octave is what adds interest, so it is kept but quietened.
function psi(x, y, t) {
  return vnoise(x * 0.30 + t * 0.009, y * 0.30 + t * 0.006) * 1.9
       + vnoise(x * 0.78 - t * 0.014, y * 0.78) * 0.42;
}

const MAXV = 28;
let vorts = [];
let spin = 1;
function addVortex(x, y, strength, radius, life) {
  vorts.push({ x: x * ASPECT, y, s: strength, r: radius, life, age: 0 });
  if (vorts.length > MAXV) vorts.shift();
}
// Fewer, wider, longer-lived, weaker. A slow eddy that lives half a minute reads as calm
// water; a fast one that dies in ten seconds reads as agitation.
// A spread of sizes: a few broad slow ones for the big shapes, plenty of small ones for
// the detail between them. All weak — the picture should read as one current with eddies
// in it, not as a field of separate whirlpools.
function ambient() {
  const big = Math.random() < 0.35;
  addVortex(Math.random(), 0.12 + Math.random() * 0.76,
            (Math.random() < 0.5 ? -1 : 1) * (big ? 0.10 + Math.random()*0.10 : 0.05 + Math.random()*0.08),
            big ? 0.55 + Math.random()*0.55 : 0.16 + Math.random()*0.26,
            26 + Math.random() * 26);
}
for (let i = 0; i < 17; i++) ambient();

// Velocity at a point, in wall-heights per second. Curl of a streamfunction, so the flow
// has no sources or sinks and the strands never pile up or tear open.
const V = { x: 0, y: 0 };

// Live hands, flattened. Positions are in wall-heights on x so the whole field works in
// one unit.
const HAND_R = 0.30, HAND_DRAG = 0.32, HAND_CURL = 0.30;
const handX = new Float32Array(8), handY = new Float32Array(8);
const handVX = new Float32Array(8), handVY = new Float32Array(8);
let handN = 0;
function setHands(hands) {
  handN = 0;
  for (let i = 0; i < hands.length && handN < 8; i++) {
    const h = hands[i];
    const px0 = (h.px0 != null ? h.px0 : h.x), py0 = (h.py0 != null ? h.py0 : h.y);
    let dx = h.x - px0; dx -= Math.round(dx);
    const dist = Math.hypot(dx * ASPECT, h.y - py0);
    // Split the hand into a few sample points along the path it covered this frame, so a
    // quick swipe drags a continuous stroke of water instead of a dotted one.
    const steps = Math.min(4, Math.max(1, Math.ceil(dist / (HAND_R * 0.6))));
    for (let k = 0; k < steps && handN < 8; k++) {
      const f = steps === 1 ? 1 : k / (steps - 1);
      handX[handN] = ((px0 + dx * f + 1) % 1) * ASPECT;
      handY[handN] = py0 + (h.y - py0) * f;
      handVX[handN] = (h.vx || 0) * ASPECT; handVY[handN] = h.vy || 0;
      handN++;
    }
  }
}
function flow(px, py, t) {
  const e = 0.05;
  let vx = (psi(px, py + e, t) - psi(px, py - e, t)) / (2 * e);
  let vy = -(psi(px + e, py, t) - psi(px - e, py, t)) / (2 * e);
  vx *= 0.165 * CFG.flow; vy *= 0.165 * CFG.flow;
  for (const o of vorts) {
    let dx = px - o.x;
    dx -= Math.round(dx / ASPECT) * ASPECT;
    const dy = py - o.y;
    const r2 = dx * dx + dy * dy;
    const r = Math.sqrt(r2) + 1e-4;
    const k = Math.min(1, o.age / 0.6) * Math.max(0, 1 - o.age / o.life);
    // Rankine-style profile: speed rises from ZERO at the centre, peaks near the core
    // radius, then falls away. A plain gaussian is fastest exactly at the middle, which
    // spins the centre into chaos and packs every particle into one blown-out white dot —
    // real vortices have an open, quiet eye, and so does the reference.
    const rn = r / o.r;
    const w = o.s * k * rn * Math.exp(1 - rn * rn) * 0.65 * CFG.vort;
    // PURE rotation, no outward term. Any radial component makes the flow divergent, and
    // a divergent flow sweeps particles out of some regions and piles them into others —
    // which is what left half the wall empty.
    vx += (-dy / r) * w;
    vy += ( dx / r) * w;
  }
  // THE HAND DRAGS THE WATER. This is the difference between "touching makes new lines
  // appear" and "the lines I can already see follow my hand": the medium near the hand is
  // given the hand's own velocity, so existing strands are carried along, and a curl term
  // wraps them around it. A vortex dropped at a fixed point cannot do this — it stays
  // where it was born while the hand moves away.
  for (let i = 0; i < handN; i++) {
    let dx = px - handX[i];
    dx -= Math.round(dx / ASPECT) * ASPECT;
    const dy = py - handY[i];
    const r2 = dx * dx + dy * dy;
    const R = HAND_R * CFG.reach;
    const g = Math.exp(-r2 / (R * R));
    if (g < 0.004) continue;
    const r = Math.sqrt(r2) + 1e-4;
    const speed = Math.hypot(handVX[i], handVY[i]);
    vx += handVX[i] * g * HAND_DRAG * CFG.drag;
    vy += handVY[i] * g * HAND_DRAG * CFG.drag;
    // Curl around the hand, signed by which side of its path you are on, so the water
    // rolls up into a swirl that travels WITH it.
    const side = (dx * handVY[i] - dy * handVX[i]) > 0 ? 1 : -1;
    const curl = HAND_CURL * CFG.curl * g * (0.25 + Math.min(speed * 2.2, 1.4)) * side;
    vx += (-dy / r) * curl;
    vy += ( dx / r) * curl;
  }

  V.x = vx; V.y = vy;
  return V;
}

// ---------------------------------------------------------------- gl
function sh(t, src) { const s = gl.createShader(t); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function link(vs, fs) { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
function fbo(w, h) { const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, w, h, 0, gl.RGBA, gl.HALF_FLOAT, null);
  const f = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, t, 0);
  gl.viewport(0, 0, w, h); gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); return { t, f, w, h }; }

const BUF_H = 620, BUF_W = Math.round(BUF_H * ASPECT);
const accum = fbo(BUF_W, BUF_H);
// Real bloom, at a quarter of the buffer: water that GLOWS rather than a wireframe. The
// cheap four-tap version only smeared the strand itself; a proper blur puts light in the
// water around it.
const BL_H = Math.round(BUF_H / 4), BL_W = Math.round(BL_H * ASPECT);
const bloomA = fbo(BL_W, BL_H), bloomB = fbo(BL_W, BL_H);

// THE WHOLE PICTURE IS THIS BUFFER. Each particle draws a short segment from where it was
// to where it is; the buffer fades a little every frame, so those segments pile up into
// one long glowing strand behind each particle. Advecting a TEXTURE (the obvious approach)
// gives a dense combed grain instead — thousands of separate luminous threads on black is
// what the reference actually is.
const quadVao = gl.createVertexArray(); gl.bindVertexArray(quadVao);
const quadVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quadVbo);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
gl.bindVertexArray(null);

const fadeProg = link(
  `#version 300 es
   layout(location=0) in vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }`,
  `#version 300 es
   precision highp float; uniform float uF; out vec4 o;
   void main(){ o=vec4(uF,uF,uF,1.0); }`);

// Strands are QUADS with a soft edge, not GL_LINES. Measured against the reference, a
// strand there is about 3 cm wide on the floor; WebGL line width is 1 px on essentially
// every driver, so a line-based version can only ever look like thread. The extra `aEdge`
// runs -1..1 across the ribbon and feathers it.
const lineProg = link(
  `#version 300 es
   layout(location=0) in vec2 aPos; layout(location=1) in vec3 aCol; layout(location=2) in float aEdge;
   out vec3 vCol; out float vEdge;
   void main(){ vCol=aCol; vEdge=aEdge; gl_Position=vec4(aPos*2.0-1.0,0.,1.); }`,
  `#version 300 es
   precision highp float; in vec3 vCol; in float vEdge; out vec4 o;
   void main(){ float a = 1.0 - vEdge*vEdge; o=vec4(vCol*a*a,1.0); }`);

const blurProg = link(
  `#version 300 es
   layout(location=0) in vec2 a; out vec2 vUv;
   void main(){ vUv=a*0.5+0.5; gl_Position=vec4(a,0.,1.); }`,
  `#version 300 es
   precision highp float; precision highp sampler2D;
   in vec2 vUv; out vec4 o;
   uniform sampler2D uTex; uniform vec2 uDir; uniform float uThresh;
   void main(){
     vec3 c = texture(uTex, vUv).rgb * 0.2270270270;
     c += texture(uTex, vUv + uDir*1.3846153846).rgb * 0.3162162162;
     c += texture(uTex, vUv - uDir*1.3846153846).rgb * 0.3162162162;
     c += texture(uTex, vUv + uDir*3.2307692308).rgb * 0.0702702703;
     c += texture(uTex, vUv - uDir*3.2307692308).rgb * 0.0702702703;
     c = max(c - uThresh, 0.0);
     o = vec4(c, 1.0);
   }`);

const dispProg = link(
  `#version 300 es
   layout(location=0) in vec2 a; out vec2 vUv;
   void main(){ vUv=a*0.5+0.5; gl_Position=vec4(a,0.,1.); }`,
  `#version 300 es
   precision highp float; precision highp sampler2D;
   in vec2 vUv; out vec4 o;
   uniform sampler2D uAcc, uBloom; uniform vec2 uView, uTexel; uniform float uExp, uGlow, uT;
   void main(){
     vec2 uv = vec2(uView.y + vUv.x*uView.x, vUv.y);
     vec3 a = texture(uAcc, uv).rgb;
     vec3 g = texture(uBloom, uv).rgb;
     vec3 c = a*uExp + g*uGlow;

     // Deep water underneath, faintly lit and very slightly graded across the room, so a
     // 23 m wall is never one flat colour.
     float across = uv.x;
     vec3 deep = mix(vec3(0.006,0.012,0.030), vec3(0.010,0.010,0.028), 0.5+0.5*sin(across*6.2831 + uT*0.02));
     c += deep;

     c = c/(1.0+c*0.42);                       // roll hot cores off instead of clipping
     float v=smoothstep(0.0,0.09,vUv.y)*smoothstep(0.0,0.08,1.0-vUv.y);
     o=vec4(pow(clamp(c*mix(1.0,v,0.25),0.0,1.0),vec3(0.92)),1.0);
   }`);
const U = (p, n) => gl.getUniformLocation(p, n);

// ---------------------------------------------------------------- particles
const PARAMS = [
  // Measured off the clip: floor mean ≈ 61/255, median ≈ 50, under 10% pure black, and
  // strands about 3 cm wide. Density and gain are set to hit those, not to taste.
  { n: 15000, fade: 0.975, gain: 0.46, life: [10, 22], exp: 1.0, glow: 0.22, width: 0.0042 },
  { n: 10000, fade: 0.986, gain: 0.32, life: [14, 30], exp: 1.0, glow: 0.26, width: 0.0055 },
  { n: 24000, fade: 0.968, gain: 0.36, life: [ 8, 17], exp: 1.0, glow: 0.20, width: 0.0032 }
];
const NMAX = 24000;   // must be >= the largest PARAMS[].n
const px = new Float32Array(NMAX), py = new Float32Array(NMAX);
const pl = new Float32Array(NMAX), pmax = new Float32Array(NMAX), pv = new Float32Array(NMAX);
const VF = 6;                                    // x, y, r, g, b, edge
const verts = new Float32Array(NMAX * 6 * VF);   // 6 vertices (2 triangles) per segment
function respawn(i, P) {
  px[i] = Math.random();
  py[i] = 0.03 + Math.random() * 0.94;
  pl[i] = 0;
  pmax[i] = P.life[0] + Math.random() * (P.life[1] - P.life[0]);
  pv[i] = 0.55 + Math.random() * 0.9;           // per-particle brightness
}
for (let i = 0; i < NMAX; i++) respawn(i, PARAMS[0]);

const lineVao = gl.createVertexArray(); gl.bindVertexArray(lineVao);
const lineVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, lineVbo);
gl.bufferData(gl.ARRAY_BUFFER, verts.byteLength, gl.DYNAMIC_DRAW);
// Stride 24, three attributes: x,y | r,g,b | edge. This MUST match the 6 floats emitQuad
// writes. It did not, briefly, and the symptom was not "slightly wrong colours" — the GPU
// read positions from the middle of the previous vertex, drew triangles the size of the
// room, and the wall went solid white.
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 24, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 8);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 24, 20);
gl.bindVertexArray(null);

// One segment → two triangles. Width is given in WALL HEIGHTS and converted per axis, so
// a strand keeps the same physical thickness whichever way it runs on a 9.58:1 canvas.
// GL_LINES cannot do this: line width is 1 px on essentially every driver, which is why
// the line-based version could only ever look like thread.
function emitQuad(buf, o, x0, y0, x1, y1, hw, r, g, b) {
  let dx = (x1 - x0) * ASPECT, dy = y1 - y0;
  const L = Math.hypot(dx, dy) || 1;
  const nx = (-dy / L) * hw / ASPECT, ny = (dx / L) * hw;
  const ax = x0 - nx, ay = y0 - ny, bx = x0 + nx, by = y0 + ny;
  const cx = x1 - nx, cy = y1 - ny, ex = x1 + nx, ey = y1 + ny;
  const V = [ax,ay,-1, bx,by,1, cx,cy,-1,  bx,by,1, ex,ey,1, cx,cy,-1];
  for (let i = 0; i < 6; i++) {
    const j = o + i * 6;
    buf[j] = V[i*3]; buf[j+1] = V[i*3+1];
    buf[j+2] = r; buf[j+3] = g; buf[j+4] = b; buf[j+5] = V[i*3+2];
  }
}

// Hand positions/colours, flattened for the inner loop — object lookups per particle per
// frame at this count are not free.
const tintX = new Float32Array(8), tintY = new Float32Array(8);
const tintR = new Float32Array(8), tintG = new Float32Array(8), tintB = new Float32Array(8);
let tintN = 0;

function stepParticles(dt, t, P, hands) {
  const n = Math.round(P.n * CFG.count);
  let w = 0;
  tintN = Math.min(hands.length, 8);
  for (let k = 0; k < tintN; k++) {
    const h = hands[k], c = PAL[h.id % PAL.length];
    tintX[k] = h.x; tintY[k] = h.y;
    tintR[k] = c[0]; tintG[k] = c[1]; tintB[k] = c[2];
  }
  for (let i = 0; i < n; i++) {
    const x0 = px[i], y0 = py[i];
    const v = flow(x0 * ASPECT, y0, t);
    let x = x0 + (v.x / ASPECT) * dt;
    let y = y0 + v.y * dt;
    x -= Math.floor(x);

    pl[i] += dt;
    // Respawn on age or on leaving the room. Without the age limit the particles drain
    // into the vortex centres and the rest of the wall empties out.
    if (pl[i] > pmax[i] || y < 0.02 || y > 0.98) { respawn(i, P); continue; }
    px[i] = x; py[i] = y;

    const sp = Math.hypot(v.x, v.y);
    // Fade in and out over the life so strands appear and vanish without popping.
    const age = Math.min(1, pl[i] * 1.1) * Math.min(1, (pmax[i] - pl[i]) * 0.45);
    const b = P.gain * CFG.gain * pv[i] * age * (0.95 + Math.min(sp * 0.8, 0.5));

    // COLOUR. Two things stop a big blue wall going monotone: slow-moving water sits
    // deeper and colder, fast water runs towards white; and a very slow tint drifts across
    // the room so no two areas are quite the same hue.
    // Colour balance taken from the clip: R:G:B ≈ 0.29 : 0.48 : 1.0. Faster water runs
    // towards white, and a very slow tint drifts across the room so a 23 m wall is never
    // one flat colour.
    const fast = Math.min(1, sp * 3.2);
    const drift = vnoise(x * 1.5 + t * 0.02, y * 1.5);
    const teal = 0.55 + 0.45 * drift;
    let cr = (0.29 + 0.45 * fast) * (0.80 + 0.20 * (1 - teal));
    let cg = (0.48 + 0.42 * fast) * (0.82 + 0.30 * teal);
    let cb = (1.00 + 0.00 * fast);
    // A hand's colour is stirred into the water near it and washes out again downstream.
    if (tintN) {
      for (let k = 0; k < tintN; k++) {
        let hx = x - tintX[k]; hx -= Math.round(hx);
        const hy = y - tintY[k];
        const g = Math.exp(-(hx * hx * ASPECT * ASPECT + hy * hy) * 9.0);
        if (g < 0.02) continue;
        cr += (tintR[k] - cr) * g * 0.8;
        cg += (tintG[k] - cg) * g * 0.8;
        cb += (tintB[k] - cb) * g * 0.8;
      }
    }

    let dx = x - x0; dx -= Math.round(dx);       // do not draw across the seam
    emitQuad(verts, w * 36, x0, y0, x0 + dx, y, P.width * CFG.width, b*cr, b*cg, b*cb);
    w++;
  }
  return w;
}

// ---------------------------------------------------------------- sparks
// Particles kicked up by a hand. The strands answer slowly — they have to travel before
// anything reads — so these exist to make a touch land INSTANTLY: bright, coloured, and
// clearly thrown by you rather than part of the water.
const SMAX = 9000;
const sx = new Float32Array(SMAX), sy = new Float32Array(SMAX);
const svx = new Float32Array(SMAX), svy = new Float32Array(SMAX);
const sl = new Float32Array(SMAX), sm = new Float32Array(SMAX);
const sr = new Float32Array(SMAX), sg = new Float32Array(SMAX), sb = new Float32Array(SMAX);
let sn = 0;
const sverts = new Float32Array(SMAX * 6 * 6);

function spawnSparks(x, y, col, n, power, hvx = 0, hvy = 0) {
  for (let i = 0; i < n; i++) {
    const idx = sn < SMAX ? sn++ : (Math.random() * SMAX) | 0;
    const a = Math.random() * Math.PI * 2;
    const sp = power * (0.25 + Math.random() * 1.0);
    sx[idx] = x + (Math.random() - 0.5) * 0.02 / ASPECT;
    sy[idx] = y + (Math.random() - 0.5) * 0.02;
    // Thrown outwards AND carried along with the hand, so the burst travels with you
    // instead of being left behind as a static puff.
    svx[idx] = Math.cos(a) * sp + hvx * 0.55;
    svy[idx] = Math.sin(a) * sp + hvy * 0.55;
    sl[idx] = 0; sm[idx] = 2.2 + Math.random() * 4.5;
    sr[idx] = col[0]; sg[idx] = col[1]; sb[idx] = col[2];
  }
}

function stepSparks(dt, t) {
  let w = 0;
  for (let i = 0; i < sn; i++) {
    sl[i] += dt;
    const life = sl[i] / sm[i];
    if (life >= 1) continue;

    const x0 = sx[i], y0 = sy[i];
    const v = flow(x0 * ASPECT, y0, t);
    // Its own kick, damped, PLUS the current it is sitting in: thrown at first, then
    // gradually just part of the water.
    svx[i] *= Math.exp(-dt / 0.55); svy[i] *= Math.exp(-dt / 0.55);
    let x = x0 + (v.x + svx[i]) / ASPECT * dt;
    let y = y0 + (v.y + svy[i]) * dt;
    x -= Math.floor(x);
    if (y < 0.02 || y > 0.98) { sl[i] = sm[i]; continue; }
    sx[i] = x; sy[i] = y;

    const b = 0.42 * Math.min(1, life * 14) * Math.pow(1 - life, 1.6);
    let dx = x - x0; dx -= Math.round(dx);
    emitQuad(sverts, w * 36, x0, y0, x0 + dx, y, 0.0035 * CFG.sparkSize, b*sr[i], b*sg[i], b*sb[i]);
    // The head: bright, round, and biggest when the spark is young.
    const hb = b * 0.55, o2 = w * 6;
    spts[o2]   = x; spts[o2+1] = y;
    spts[o2+2] = (0.0035 + 0.006 * (1 - life)) * accum.h * CFG.sparkSize;
    spts[o2+3] = hb*sr[i]; spts[o2+4] = hb*sg[i]; spts[o2+5] = hb*sb[i];
    w++;
  }
  return w;
}

// A ribbon alone is a streak; what reads as a PARTICLE is a bright round head at the
// front of it. Point sprites are drawn on top of the spark trails for exactly that.
const spointProg = link(
  `#version 300 es
   layout(location=0) in vec2 aPos; layout(location=1) in float aSize; layout(location=2) in vec3 aCol;
   out vec3 vCol;
   void main(){ vCol=aCol; gl_PointSize=max(aSize,2.0); gl_Position=vec4(aPos*2.0-1.0,0.,1.); }`,
  `#version 300 es
   precision highp float; in vec3 vCol; out vec4 o;
   void main(){
     float d = length(gl_PointCoord-0.5)*2.0;
     float a = exp(-d*d*3.4) * smoothstep(1.0,0.55,d);
     o = vec4(vCol*a, 1.0);
   }`);
const spts = new Float32Array(SMAX * 6);
const spVao = gl.createVertexArray(); gl.bindVertexArray(spVao);
const spVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, spVbo);
gl.bufferData(gl.ARRAY_BUFFER, spts.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 24, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 1, gl.FLOAT, false, 24, 8);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 3, gl.FLOAT, false, 24, 12);
gl.bindVertexArray(null);

const sparkVao = gl.createVertexArray(); gl.bindVertexArray(sparkVao);
const sparkVbo = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, sparkVbo);
gl.bufferData(gl.ARRAY_BUFFER, sverts.byteLength, gl.DYNAMIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 24, 0);
gl.enableVertexAttribArray(1); gl.vertexAttribPointer(1, 3, gl.FLOAT, false, 24, 8);
gl.enableVertexAttribArray(2); gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 24, 20);
gl.bindVertexArray(null);

// ---------------------------------------------------------------- hands
const PAL = [[0.45,0.85,1.0],[0.65,0.60,1.0],[1.0,0.65,0.80],[1.0,0.85,0.55],[0.60,1.0,0.85]];
const demo = [
  { id:0, cx:0.476, cy:0.55, ax:0.030, ay:0.17, sx:0.33, sy:0.55, ph:0.0, x:0, y:0, first:true, run:0 },
  { id:1, cx:0.528, cy:0.42, ax:0.024, ay:0.20, sx:0.57, sy:0.37, ph:2.4, x:0, y:0, first:true, run:0 }
];
let mouse = null;
function viewSlice(){ const view=viewFull?ASPECT:WALL, w=view/ASPECT; return {w, x: viewFull?0:0.5-w/2}; }
function toPano(e){ const r=canvas.getBoundingClientRect(), s=viewSlice();
  return { x:s.x+((e.clientX-r.left)/r.width)*s.w, y:1-(e.clientY-r.top)/r.height }; }
function stir(h, x, y, dt) {
  let dx = x - h.x; dx -= Math.round(dx);
  const d = Math.hypot(dx * ASPECT, y - h.y);
  // Velocity of the hand itself, smoothed — this is what the water is dragged by.
  const ivx = dx * ASPECT / Math.max(dt, 1e-3), ivy = (y - h.y) / Math.max(dt, 1e-3);
  // Heavier smoothing than feels necessary: this number drives a force on the whole
  // medium, so a single jumpy sample is visible as a jolt across the wall.
  const k = 1 - Math.exp(-dt / 0.10);
  h.vx = (h.vx || 0) + (ivx - (h.vx || 0)) * k;
  h.vy = (h.vy || 0) + (ivy - (h.vy || 0)) * k;
  h.run += d;
  // Dragging through a fluid sheds a STREET of vortices spinning alternately — that is
  // what makes a swipe stir rather than smear.
  // A much weaker shed vortex: just enough that the swirl the hand rolled up keeps
  // turning for a few seconds after the hand has gone.
  if (h.run > 0.22) { h.run = 0; spin = -spin;
    addVortex(x, y, spin * 0.09, 0.30 + Math.random() * 0.16, 6 + Math.random() * 4); }
  // Sparks scale with how fast the hand is going, so a slow stroke glows and a quick
  // swipe throws a shower.
  if (d > 1e-4) {
    h.sparkRun = (h.sparkRun || 0) + d;
    if (CFG.sparkRate > 0 && h.sparkRun > 0.014 / CFG.sparkRate) {
      h.sparkRun = 0;
      spawnSparks(x, y, PAL[h.id % PAL.length], 5 + ((Math.min(d, 0.06) * 110) | 0), 0.16 + Math.min(d * 8, 0.38), h.vx || 0, h.vy || 0);
    }
  }
  h.x = x; h.y = y;
}
canvas.addEventListener('pointerdown', e => { const p = toPano(e);
  mouse = { x:p.x, y:p.y, id:(Math.random()*5)|0, run:0 };
  addVortex(p.x, p.y, (Math.random()<0.5?-1:1)*0.20, 0.30, 8);
  spawnSparks(p.x, p.y, PAL[mouse.id % PAL.length], 160, 0.5);
  try { canvas.setPointerCapture(e.pointerId); } catch(_) {} });
let mouseLast = 0;
canvas.addEventListener('pointermove', e => {
  if (!mouse) return;
  const now = performance.now();
  const dtp = Math.min(0.1, Math.max(0.004, (now - (mouseLast || now - 16)) / 1000));
  mouseLast = now;
  const p = toPano(e);
  stir(mouse, p.x, p.y, dtp);
});
window.addEventListener('pointerup', () => { mouse = null; });

document.querySelectorAll('[data-look]').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('[data-look]').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); look = +b.dataset.look;
  for (let i=0;i<NMAX;i++) respawn(i, PARAMS[look]);
  document.getElementById('desc').innerHTML = DESCS[look]; }));
document.getElementById('viewBtn').addEventListener('click', e => { viewFull=!viewFull;
  e.target.textContent = viewFull?'Đang xem: CẢ 5 TƯỜNG (10350×1080)':'Đang xem: 1 TƯỜNG (560×240)'; resize(); });
document.getElementById('clearBtn').addEventListener('click', () => { vorts=[];
  for(let i=0;i<14;i++) ambient();
  gl.bindFramebuffer(gl.FRAMEBUFFER, accum.f); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); });
document.getElementById('desc').innerHTML = DESCS[0];

// ---------------------------------------------------------------- live controls
// Twelve rounds of me guessing at "prettier" is twelve rounds too many: the person who
// can see what is wrong should be holding the knobs. Everything below is live — no
// reload — and COPY prints the exact numbers to paste into the room config.
const CFG = {
  flow: 1.0, vort: 1.0,
  life: 1.0, width: 1.0, count: 1.0, gain: 1.0, glow: 1.0,
  drag: 1.0, curl: 1.0, reach: 1.0,
  sparkRate: 1.0, sparkSize: 1.0
};
const SLIDERS = [
  ['flow','tốc độ dòng',0.2,2.5], ['vort','độ xoáy',0,2.5],
  ['life','độ dài sợi',0.3,2.5], ['width','bề rộng sợi',0.3,3],
  ['count','mật độ sợi',0.2,1.6], ['gain','độ sáng sợi',0.2,3],
  ['glow','quầng sáng',0,3],
  ['drag','lực kéo của tay',0,3], ['curl','độ cuộn quanh tay',0,3], ['reach','tầm với của tay',0.3,3],
  ['sparkRate','lượng hạt',0,3], ['sparkSize','cỡ hạt',0.3,3]
];
const ctl = document.getElementById('ctl');
for (const [k,label,lo,hi] of SLIDERS) {
  const el = document.createElement('label');
  el.innerHTML = `<span>${label}</span><input type=range min=${lo} max=${hi} step=0.01 value=${CFG[k]}><b>${CFG[k].toFixed(2)}</b>`;
  const inp = el.querySelector('input'), out = el.querySelector('b');
  inp.addEventListener('input', () => { CFG[k] = +inp.value; out.textContent = CFG[k].toFixed(2); });
  ctl.appendChild(el);
}
const copyBtn = document.createElement('button');
copyBtn.textContent = 'COPY số đang chỉnh';
copyBtn.style.gridColumn = '1 / -1';
copyBtn.addEventListener('click', () => {
  const txt = JSON.stringify(CFG, null, 2);
  navigator.clipboard?.writeText(txt);
  copyBtn.textContent = 'đã copy — dán cho kỹ thuật: ' + JSON.stringify(CFG);
});
ctl.appendChild(copyBtn);

function resize(){ const w=canvas.clientWidth, view=viewFull?ASPECT:WALL;
  const h=Math.round(w/view); canvas.style.height=h+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
window.addEventListener('resize', resize);

let t0 = performance.now(), last = t0;
function frame() {
  requestAnimationFrame(frame); resize();
  const now = performance.now();
  const dt = Math.min(Math.max((now-last)/1000, 1/240), 1/20); last = now;
  const t = (now - t0) / 1000;
  const P = PARAMS[look];

  const hands = [];
  for (const h of demo) {
    const x=(h.cx+h.ax*Math.sin(t*h.sx+h.ph)+1)%1, y=h.cy+h.ay*Math.sin(t*h.sy+h.ph*1.7);
    if (h.first) { h.x=x; h.y=y; h.first=false; }
    const px0 = h.x, py0 = h.y;
    stir(h, x, y, dt); hands.push({x, y, id:h.id, vx:h.vx, vy:h.vy, px0, py0});
  }
  if (mouse) hands.push({x:mouse.x, y:mouse.y, id:mouse.id, vx:mouse.vx, vy:mouse.vy});

  for (const o of vorts) {
    o.age += dt;
    o.x += Math.sin(o.y*2.1 + o.age*0.3)*0.025*dt;
    o.y = Math.min(0.95, Math.max(0.05, o.y + Math.cos(o.x*0.7 - o.age*0.25)*0.010*dt));
  }
  vorts = vorts.filter(o => o.age < o.life);
  if (vorts.length < 17 && Math.random() < dt*1.4) ambient();

  setHands(hands);            // must run BEFORE anything samples the flow
  const count = stepParticles(dt, t, P, hands);
  const scount = stepSparks(dt, t);

  // fade the accumulation, then draw this frame's segments into it
  gl.bindFramebuffer(gl.FRAMEBUFFER, accum.f);
  gl.viewport(0, 0, accum.w, accum.h);
  gl.useProgram(fadeProg);
  gl.uniform1f(U(fadeProg,'uF'), Math.pow(1 - (1 - P.fade) / CFG.life, dt*60));
  gl.bindVertexArray(quadVao);
  gl.enable(gl.BLEND); gl.blendFunc(gl.ZERO, gl.SRC_COLOR);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.useProgram(lineProg);
  gl.bindVertexArray(lineVao);
  gl.bindBuffer(gl.ARRAY_BUFFER, lineVbo);
  gl.bufferSubData(gl.ARRAY_BUFFER, 0, verts.subarray(0, count*36));
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.drawArrays(gl.TRIANGLES, 0, count*6);

  if (scount) {
    gl.bindVertexArray(sparkVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, sparkVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, sverts.subarray(0, scount*36));
    gl.drawArrays(gl.TRIANGLES, 0, scount*6);

    gl.useProgram(spointProg);
    gl.bindVertexArray(spVao);
    gl.bindBuffer(gl.ARRAY_BUFFER, spVbo);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, spts.subarray(0, scount*6));
    gl.drawArrays(gl.POINTS, 0, scount);
  }
  gl.disable(gl.BLEND);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // bloom: threshold + separable blur at quarter size
  gl.bindVertexArray(quadVao);
  gl.useProgram(blurProg);
  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.f); gl.viewport(0,0,bloomA.w,bloomA.h);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, accum.t);
  gl.uniform1i(U(blurProg,'uTex'),0);
  gl.uniform2f(U(blurProg,'uDir'), 1.6/bloomA.w, 0);
  gl.uniform1f(U(blurProg,'uThresh'), 0.06);
  gl.drawArrays(gl.TRIANGLES,0,3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB.f); gl.viewport(0,0,bloomB.w,bloomB.h);
  gl.bindTexture(gl.TEXTURE_2D, bloomA.t);
  gl.uniform2f(U(blurProg,'uDir'), 0, 1.6/bloomA.h);
  gl.uniform1f(U(blurProg,'uThresh'), 0.0);
  gl.drawArrays(gl.TRIANGLES,0,3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomA.f);
  gl.bindTexture(gl.TEXTURE_2D, bloomB.t);
  gl.uniform2f(U(blurProg,'uDir'), 3.4/bloomA.w, 0);
  gl.drawArrays(gl.TRIANGLES,0,3);

  gl.bindFramebuffer(gl.FRAMEBUFFER, bloomB.f);
  gl.bindTexture(gl.TEXTURE_2D, bloomA.t);
  gl.uniform2f(U(blurProg,'uDir'), 0, 3.4/bloomA.h);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  // display
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.useProgram(dispProg);
  const s = viewSlice();
  gl.uniform2f(U(dispProg,'uView'), s.w, s.x);
  gl.uniform2f(U(dispProg,'uTexel'), 1/accum.w, 1/accum.h);
  gl.uniform1f(U(dispProg,'uExp'), P.exp);
  gl.uniform1f(U(dispProg,'uGlow'), P.glow * CFG.glow);
  gl.uniform1f(U(dispProg,'uT'), t);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, accum.t);
  gl.uniform1i(U(dispProg,'uAcc'), 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, bloomB.t);
  gl.uniform1i(U(dispProg,'uBloom'), 1);
  gl.bindVertexArray(quadVao);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
resize(); frame();
</script>
</body>
</html>
