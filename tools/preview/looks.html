<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>LiDAR Wall — thử hướng visual</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; background:#07080c; color:#c8d4e4;
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .wrap { max-width:1500px; margin:0 auto; padding:18px 20px 40px; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.14em; color:#8fb8dd; margin:0 0 4px; }
  .sub { color:#5d6b80; margin:0 0 16px; }
  canvas { display:block; width:100%; border-radius:6px; background:#000; cursor:crosshair; touch-action:none; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 10px; }
  button { font:inherit; color:#b9c9dc; background:#131722; border:1px solid #26304a;
           padding:7px 14px; border-radius:5px; cursor:pointer; }
  button:hover { border-color:#3d5686; color:#e6f0fb; }
  button.on { background:#1d2942; border-color:#5b83c8; color:#eaf3ff; }
  .desc { color:#7e8ea6; margin:12px 0 0; max-width:80ch; }
  .desc b { color:#a9c4e2; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LiDAR WALL — thử 4 hướng visual</h1>
  <p class="sub">Giữ chuột và kéo để giả làm bàn tay quẹt trên tường. Có 2 "người" tự chạy sẵn.
    Sóng và vệt ở đây chạy đúng vật lý của engine, nên cảm giác tương tác là thật.</p>

  <div class="bar">
    <button data-look="0" class="on">1 · LỤA</button>
    <button data-look="1">2 · PHÁT QUANG</button>
    <button data-look="2">3 · NỨT VỠ</button>
    <button data-look="3">4 · DÂY ĐÀN</button>
    <span style="flex:1"></span>
    <button id="viewBtn">Đang xem: 1 TƯỜNG (560×240)</button>
    <button id="clearBtn">Xoá</button>
  </div>

  <canvas id="c"></canvas>
  <p class="desc" id="desc"></p>
</div>

<script>
const DESCS = [
 '<b>LỤA</b> — cả phòng là một tấm lụa đen căng, chỉ hiện ra khi ánh sáng bắt vào nếp gấp. Quẹt tay = miết lên vải: nếp gấp chạy theo tay, bắt sáng lấp lánh dọc theo vệt, rồi lụa từ từ phẳng lại. Gần như đen tuyền khi không ai chạm — hợp phòng tối, và máy chiếu chỉ phải sáng ở đúng chỗ có nếp.',
 '<b>PHÁT QUANG</b> — mặt nước đen kịt đầy sinh vật phù du. Chúng chỉ sáng lên khi bị khuấy: tay đi tới đâu, một vệt lân tinh bùng lên tới đó rồi tắt dần trong vài giây. Sóng lan ra cũng đánh thức chúng theo, nên vòng sáng lan đi cả mét sau khi bạn đã rút tay. Tương phản mạnh nhất trong 4 hướng.',
 '<b>NỨT VỠ</b> — tường như một tấm băng/kính. Chạm = một vết nứt nổ ra từ điểm chạm và lan theo nhánh; quẹt = xé một đường dài. Vết nứt phát sáng lúc mới nứt rồi nguội dần và "lành" lại. Kịch tính nhất, đọc rõ nhất từ xa.',
 '<b>DÂY ĐÀN</b> — hàng trăm sợi dây căng dọc suốt phòng. Chạm = gảy một dây, nó rung và tắt dần; quẹt ngang = <em>quét cả dàn dây</em> như gảy đàn hạc, sóng rung chạy lan sang các dây bên cạnh. Đơn giản nhất về hình, nhưng tương tác dễ hiểu và "đã tay" nhất.'
];

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha:false, antialias:false });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
  document.body.innerHTML = '<p style="padding:40px">Trình duyệt thiếu WebGL2 hoặc float render target.</p>';
}

const ASPECT = 10350/1080;
const WALL = 560/240;
let viewFull = false, look = 0;

// ---------------------------------------------------------------- gl helpers
const VS = `#version 300 es
layout(location=0) in vec2 a; out vec2 vUv; out vec2 vL; out vec2 vR; out vec2 vT; out vec2 vB;
uniform vec2 uTexel;
void main(){ vUv=a*0.5+0.5; vL=vUv-vec2(uTexel.x,0.); vR=vUv+vec2(uTexel.x,0.);
  vT=vUv+vec2(0.,uTexel.y); vB=vUv-vec2(0.,uTexel.y); gl_Position=vec4(a,0.,1.); }`;
const HEAD = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; in vec2 vL; in vec2 vR; in vec2 vT; in vec2 vB; out vec4 o;
float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float vn(vec2 x){ vec2 i=floor(x),f=fract(x); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y); }
float fbm(vec2 x){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*vn(x); x*=2.03; a*=.5; } return s; }
vec4 fs(sampler2D s, vec2 uv, vec2 tx){ vec2 h=tx*0.9;
  return 0.25*(texture(s,uv+vec2(h.x,h.y))+texture(s,uv+vec2(-h.x,h.y))
              +texture(s,uv+vec2(h.x,-h.y))+texture(s,uv+vec2(-h.x,-h.y))); }
`;
function sh(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+'\n'+src); return s; }
function prog(fs_){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs_)); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
function fbo(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.viewport(0,0,w,h); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); return {t,f,w,h,tx:1/w,ty:1/h}; }
function dbl(w,h){ let a=fbo(w,h),b=fbo(w,h);
  return { get read(){return a;}, get write(){return b;}, swap(){const t=a;a=b;b=t;}, w,h,tx:1/w,ty:1/h }; }

const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
function blit(t){ gl.bindVertexArray(vao);
  if(t){ gl.viewport(0,0,t.w,t.h); gl.bindFramebuffer(gl.FRAMEBUFFER,t.f); }
  else { gl.viewport(0,0,canvas.width,canvas.height); gl.bindFramebuffer(gl.FRAMEBUFFER,null); }
  gl.drawArrays(gl.TRIANGLES,0,3); }
function U(p,n){ return gl.getUniformLocation(p,n); }

// ---------------------------------------------------------------- fields (same physics as the engine)
const SIM_H = 190, SIM_W = Math.round(SIM_H*ASPECT);
const wave = dbl(SIM_W,SIM_H), trail = dbl(SIM_W,SIM_H);

const pWaveStep = prog(HEAD+`uniform sampler2D uW; uniform float uK,uD;
void main(){ vec2 c=texture(uW,vUv).rg;
  float lap=texture(uW,vL).r+texture(uW,vR).r+texture(uW,vT).r+texture(uW,vB).r-4.*c.r;
  o=vec4((2.*c.r-c.g+uK*lap)*uD, c.r, 0., 1.); }`);
const pWaveSplat = prog(HEAD+`uniform sampler2D uT; uniform float uA,uR,uAmp; uniform vec2 uP;
void main(){ vec2 p=vUv-uP; p.x-=round(p.x); p.x*=uA;
  float g=exp(-dot(p,p)/uR)*uAmp; vec2 c=texture(uT,vUv).rg; o=vec4(c.r+g,c.g+g,0.,1.); }`);
const pTrailSplat = prog(HEAD+`uniform sampler2D uT; uniform float uA,uR,uAmt,uCap; uniform vec2 uP; uniform vec3 uC;
void main(){ vec2 p=vUv-uP; p.x-=round(p.x); p.x*=uA;
  float g=exp(-dot(p,p)/uR)*uAmt; vec4 pr=texture(uT,vUv);
  float na=min(pr.a+g,uCap); vec3 c=mix(pr.rgb,uC,clamp(g/max(na,1e-4),0.,1.)); o=vec4(c,na); }`);
const pDecay = prog(HEAD+`uniform sampler2D uT; uniform float uD; void main(){ o=texture(uT,vUv)*uD; }`);

function waveImpulse(x,y,amp,r=0.030){
  gl.useProgram(pWaveSplat); gl.uniform2f(U(pWaveSplat,'uTexel'),wave.tx,wave.ty);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,wave.read.t); gl.uniform1i(U(pWaveSplat,'uT'),0);
  gl.uniform1f(U(pWaveSplat,'uA'),ASPECT); gl.uniform2f(U(pWaveSplat,'uP'),x,y);
  gl.uniform1f(U(pWaveSplat,'uR'),r*r); gl.uniform1f(U(pWaveSplat,'uAmp'),amp);
  blit(wave.write); wave.swap();
}
function deposit(x,y,c,amt,r=0.045){
  gl.useProgram(pTrailSplat); gl.uniform2f(U(pTrailSplat,'uTexel'),trail.tx,trail.ty);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,trail.read.t); gl.uniform1i(U(pTrailSplat,'uT'),0);
  gl.uniform1f(U(pTrailSplat,'uA'),ASPECT); gl.uniform2f(U(pTrailSplat,'uP'),x,y);
  gl.uniform1f(U(pTrailSplat,'uR'),r*r); gl.uniform1f(U(pTrailSplat,'uAmt'),amt);
  gl.uniform1f(U(pTrailSplat,'uCap'),1.0); gl.uniform3f(U(pTrailSplat,'uC'),c[0],c[1],c[2]);
  blit(trail.write); trail.swap();
}
// Deposit along the segment and proportional to DISTANCE — the engine's rule. Time-based
// deposit leaves nothing under a fast swipe, which is the bug this whole page exists to
// avoid re-learning.
function stroke(ax,ay,bx,by,c,ink){
  let dx=bx-ax; dx-=Math.round(dx); const dy=by-ay;
  const dist=Math.hypot(dx*ASPECT,dy), step=0.045*0.5;
  const n=Math.min(14,Math.max(1,Math.ceil(dist/step))), per=ink*(dist/step)/n;
  if(per>1e-4) for(let i=1;i<=n;i++){ const f=i/n; deposit((ax+dx*f+1)%1, ay+dy*f, c, per); }
  return dist;
}
function stepFields(dt){
  for(let i=0;i<3;i++){
    gl.useProgram(pWaveStep); gl.uniform2f(U(pWaveStep,'uTexel'),wave.tx,wave.ty);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,wave.read.t); gl.uniform1i(U(pWaveStep,'uW'),0);
    gl.uniform1f(U(pWaveStep,'uK'),0.42); gl.uniform1f(U(pWaveStep,'uD'),0.9993);
    blit(wave.write); wave.swap();
  }
  gl.useProgram(pDecay); gl.uniform2f(U(pDecay,'uTexel'),trail.tx,trail.ty);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,trail.read.t); gl.uniform1i(U(pDecay,'uT'),0);
  gl.uniform1f(U(pDecay,'uD'),Math.exp(-dt/2.6));
  blit(trail.write); trail.swap();
}

// ---------------------------------------------------------------- the four looks
const DHEAD = HEAD + `
uniform sampler2D uWave, uTrail;
uniform vec2 uSimTexel, uView;   // uView.x = width of the visible slice, .y = left edge
uniform float uT, uA;
vec2 pano(){ return vec2(uView.y + vUv.x*uView.x, vUv.y); }
`;

const LOOKS = [
// ---- 1. SILK ----------------------------------------------------------------
DHEAD + `
void main(){
  vec2 uv = pano();
  vec2 p = vec2(uv.x*uA, uv.y);

  // Hanging cloth at rest: soft vertical folds, nothing else. In a dark room the fabric
  // is invisible except where a highlight runs along a fold — that IS the look, and it is
  // also why the projector only has to be bright in a few thin places.
  float folds = sin(p.x*2.3 + fbm(p*0.35)*3.0) * 0.055
              + sin(p.x*5.7 + 1.7) * 0.018;

  float w = fs(uWave,uv,uSimTexel).r;
  vec4 tr = fs(uTrail,uv,uSimTexel);
  // Creases outlive the ripple: that is what makes a swipe feel like it MOVED the cloth
  // rather than just wobbled it.
  float h = folds + w*0.75 + tr.a*1.9;

  vec2 g = vec2(dFdx(h), dFdy(h)) * 1400.0;
  vec3 n = normalize(vec3(-g.x, -g.y, 1.0));
  vec3 L1 = normalize(vec3(-0.45, 0.62, 0.64));
  vec3 L2 = normalize(vec3( 0.72, 0.22, 0.66));
  vec3 T  = normalize(vec3(1.0, 0.10, 0.0));       // weave runs across the room

  // Anisotropic: the highlight is stretched ALONG the weave. This one term is the whole
  // difference between silk and shiny plastic.
  float a1 = pow(1.0 - abs(dot(T, normalize(reflect(-L1,n)))), 52.0);
  float a2 = pow(1.0 - abs(dot(T, normalize(reflect(-L2,n)))), 38.0);
  float slope = clamp(length(g)*0.35, 0.0, 1.0);   // flat cloth stays dark

  vec3 warm = vec3(1.00,0.84,0.64), cool = vec3(0.40,0.62,1.00);
  vec3 c = vec3(0.006,0.007,0.012);
  c += warm * a1 * (0.20 + 0.80*slope) * 1.15;
  c += cool * a2 * (0.15 + 0.85*slope) * 0.80;
  c += warm * max(dot(n,L1),0.0) * 0.030;          // barely any diffuse — cloth, not paper

  vec3 tint = tr.rgb;
  c += tint * a1 * min(tr.a*2.2,1.0) * 0.85;
  c += tint * smoothstep(0.10,0.9,tr.a) * 0.055;

  float v = smoothstep(0.0,0.10,vUv.y)*smoothstep(0.0,0.09,1.0-vUv.y);
  o = vec4(pow(clamp(c*mix(1.0,v,0.35),0.0,1.0), vec3(0.92)), 1.0);
}`,

// ---- 2. BIOLUMINESCENCE -----------------------------------------------------
DHEAD + `
// One organism per cell, at a random spot in it. Rounder and sparser than thresholded
// noise, which reads as countless separate creatures rather than a speckled texture.
float plankton(vec2 x, float t, out float seed){
  vec2 n=floor(x), f=fract(x);
  float best=1e3; seed=0.0;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g=vec2(float(i),float(j));
    float s1=h21(n+g), s2=h21(n+g+19.3);
    vec2 op=g+vec2(s1,s2)+0.06*vec2(sin(t*0.5+s1*40.0), cos(t*0.4+s2*33.0));
    float d=length(op-f);
    if(d<best){ best=d; seed=s1; }
  }
  return best;
}
void main(){
  vec2 uv = pano();
  vec2 p = vec2(uv.x*uA, uv.y);
  float w = fs(uWave,uv,uSimTexel).r;
  vec4 tr = fs(uTrail,uv,uSimTexel);

  // Disturbance, not presence: a travelling wave counts, so light keeps waking up metres
  // away long after the hand has gone.
  float exc = clamp(tr.a*1.9 + abs(w)*4.5, 0.0, 1.8);

  float s1, s2;
  float d1 = plankton(p*26.0, uT, s1);
  float d2 = plankton(p*62.0 + 11.0, uT*0.7, s2);
  float big = exp(-d1*d1*90.0) * (0.55 + 0.45*sin(uT*3.0 + s1*60.0));
  float small = exp(-d2*d2*150.0) * (0.5 + 0.5*sin(uT*4.5 + s2*80.0)) * 0.55;
  float grain = big + small;

  vec3 col = mix(vec3(0.22,0.92,0.85), tr.rgb+0.001, clamp(tr.a*1.3,0.0,0.8));
  vec3 c = vec3(0.003,0.008,0.016);
  c += col * grain * (0.04 + exc*2.9);              // a few always glow faintly
  c += col * exc*exc * 0.085;                       // halo where it is dense
  c += vec3(0.06,0.40,0.55) * pow(max(abs(w)*2.6,0.0),2.0) * 0.30;

  float v = smoothstep(0.0,0.10,vUv.y)*smoothstep(0.0,0.09,1.0-vUv.y);
  o = vec4(pow(clamp(c*mix(1.0,v,0.30),0.0,1.0), vec3(0.90)), 1.0);
}`,

// ---- 3. CRACKS --------------------------------------------------------------
DHEAD + `
// Worley cells; the cell EDGES are the cracks. Animated slowly so the pane is never
// exactly the same twice, but slow enough that a crack looks structural, not alive.
vec2 cell(vec2 n){ return vec2(h21(n), h21(n+31.7)); }
float edgeDist(vec2 x, out vec2 id){
  vec2 n=floor(x), f=fract(x); vec2 mg,mr; float md=8.0;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 g=vec2(float(i),float(j)); vec2 op=g+0.5+0.40*sin(uT*0.06+6.2831*cell(n+g));
    vec2 r=op-f; float d=dot(r,r); if(d<md){ md=d; mr=r; mg=g; } }
  id = n+mg;
  md=8.0;
  for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){
    vec2 g=mg+vec2(float(i),float(j)); vec2 op=g+0.5+0.40*sin(uT*0.06+6.2831*cell(n+g));
    vec2 r=op-f; if(dot(mr-r,mr-r)>1e-4) md=min(md,dot(0.5*(mr+r),normalize(r-mr))); }
  return md;
}
void main(){
  vec2 uv = pano();
  vec2 p = vec2(uv.x*uA, uv.y);
  float w = fs(uWave,uv,uSimTexel).r;
  vec4 tr = fs(uTrail,uv,uSimTexel);

  vec2 id;
  float e = edgeDist(p*9.0, id);
  float line = 1.0 - smoothstep(0.006, 0.030, e);
  float halo = exp(-e*13.0);

  // A crack only exists where the pane has been stressed: the trail opens it, the wave
  // front running outward opens more, so the fracture PROPAGATES away from the touch.
  float stress = clamp(tr.a*2.1 + max(w,0.0)*3.4, 0.0, 1.6);
  // Each cell breaks at its own threshold, so the fracture front is ragged, not a circle.
  float thr = 0.10 + 0.45*h21(id);
  float broken = smoothstep(thr, thr+0.25, stress);

  vec3 tint = mix(vec3(0.45,0.72,1.0), tr.rgb+0.001, clamp(tr.a*1.4,0.0,0.9));
  vec3 c = vec3(0.007,0.010,0.018);
  c += vec3(0.030,0.048,0.080) * line;                    // hairlines: barely there at rest
  c += tint * line * broken * 3.0;                        // freshly opened, hot
  c += tint * halo * broken * 0.55;
  c += vec3(1.0) * line * pow(broken,2.2) * 1.2;          // white at the instant of breaking
  c += tint * 0.06 * broken * broken;

  float v = smoothstep(0.0,0.10,vUv.y)*smoothstep(0.0,0.09,1.0-vUv.y);
  o = vec4(pow(clamp(c*mix(1.0,v,0.30),0.0,1.0), vec3(0.92)), 1.0);
}`,

// ---- 4. STRINGS -------------------------------------------------------------
DHEAD + `
void main(){
  vec2 uv = pano();
  float N = 128.0;                       // strings around the whole room
  float sx = uv.x*N;
  float idx = floor(sx);
  float frac = fract(sx) - 0.5;

  // Each string is displaced by the field sampled AT THE STRING, shaped like a plucked
  // string: zero at the anchors, maximum in the middle. That is why a swipe across them
  // reads as strumming rather than smearing.
  vec2 at = vec2((idx+0.5)/N, uv.y);
  float w = fs(uWave,at,uSimTexel).r;
  vec4 tr = fs(uTrail,at,uSimTexel);
  float shape = sin(3.14159*uv.y);
  float disp = (w*5.5 + tr.a*1.6) * shape;

  float d = abs(frac - disp*N*0.02);     // distance to the displaced string, in cell units
  float core = 1.0 - smoothstep(0.020, 0.075, d);
  float glow = exp(-d*7.0);

  float energy = clamp(abs(w)*3.0 + tr.a*1.2, 0.0, 1.5);
  vec3 tint = mix(vec3(0.42,0.66,1.00), tr.rgb+0.001, clamp(tr.a*1.5,0.0,0.9));

  vec3 c = vec3(0.006,0.009,0.016);
  c += vec3(0.055,0.085,0.150) * core;                   // resting string: only just visible
  c += tint * core * energy * 3.0;                       // ringing
  c += tint * glow * energy * 0.70;
  c += vec3(1.0) * core * pow(energy,2.2) * 0.60;

  // Faint anchors top and bottom, so the strings read as tensioned between floor and
  // ceiling rather than floating.
  c += vec3(0.035,0.055,0.085) * (smoothstep(0.04,0.0,uv.y) + smoothstep(0.96,1.0,uv.y));

  o = vec4(pow(clamp(c,0.0,1.0), vec3(0.92)), 1.0);
}`
];

const progs = LOOKS.map(f => prog(DHEAD_FIX(f)));
function DHEAD_FIX(f){ return f; }

// ---------------------------------------------------------------- interaction
const PAL = [[0.24,0.86,0.95],[0.45,0.42,1.0],[0.95,0.35,0.72],[1.0,0.72,0.32],[0.36,0.68,1.0]];
const hands = [
  { id:0, cx:0.30, cy:0.55, ax:0.075, ay:0.15, sx:0.37, sy:0.61, ph:0.0, x:0, y:0, first:true },
  { id:1, cx:0.66, cy:0.45, ax:0.110, ay:0.20, sx:0.63, sy:0.41, ph:2.4, x:0, y:0, first:true }
];
let mouse = null;

function viewSlice(){ const view = viewFull ? ASPECT : WALL; const w = view/ASPECT;
  return { w, x: viewFull ? 0 : 0.5 - w/2 }; }
function toPano(e){ const r=canvas.getBoundingClientRect(), s=viewSlice();
  return { x: s.x + ((e.clientX-r.left)/r.width)*s.w, y: 1-(e.clientY-r.top)/r.height }; }

canvas.addEventListener('pointerdown', e=>{
  const p=toPano(e); mouse={ x:p.x, y:p.y, id:(Math.random()*5)|0 };
  waveImpulse(p.x,p.y,0.55); deposit(p.x,p.y,PAL[mouse.id],0.25,0.054);
  try{ canvas.setPointerCapture(e.pointerId); }catch(_){}
});
canvas.addEventListener('pointermove', e=>{
  if(!mouse) return; const p=toPano(e);
  const d=stroke(mouse.x,mouse.y,p.x,p.y,PAL[mouse.id],0.25);
  if(d>1e-4) waveImpulse(p.x,p.y,Math.min(1.6*d,0.12),0.024);
  mouse.x=p.x; mouse.y=p.y;
});
window.addEventListener('pointerup', ()=>{ mouse=null; });

document.querySelectorAll('[data-look]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-look]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); look=+b.dataset.look;
  document.getElementById('desc').innerHTML=DESCS[look];
}));
document.getElementById('viewBtn').addEventListener('click', e=>{
  viewFull=!viewFull;
  e.target.textContent = viewFull ? 'Đang xem: CẢ 5 TƯỜNG (10350×1080)' : 'Đang xem: 1 TƯỜNG (560×240)';
  resize();
});
document.getElementById('clearBtn').addEventListener('click', ()=>{
  for(const t of [wave.read,wave.write,trail.read,trail.write]){
    gl.bindFramebuffer(gl.FRAMEBUFFER,t.f); gl.clearColor(0,0,0,0); gl.clear(gl.COLOR_BUFFER_BIT); }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
});
document.getElementById('desc').innerHTML=DESCS[0];

function resize(){
  const w=canvas.clientWidth, view=viewFull?ASPECT:WALL;
  const h=Math.round(w/view); canvas.style.height=h+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
}
window.addEventListener('resize',resize);

let t0=performance.now(), last=t0;
function frame(){
  requestAnimationFrame(frame);
  resize();
  const now=performance.now(); const dt=Math.min(Math.max((now-last)/1000,1/240),1/20); last=now;
  const t=(now-t0)/1000;

  for(const h of hands){
    const x=(h.cx+h.ax*Math.sin(t*h.sx+h.ph)+1)%1;
    const y=h.cy+h.ay*Math.sin(t*h.sy+h.ph*1.7);
    if(h.first){ h.x=x; h.y=y; h.first=false; waveImpulse(x,y,0.55); }
    const d=stroke(h.x,h.y,x,y,PAL[h.id],0.25);
    if(d>1e-4) waveImpulse(x,y,Math.min(1.6*d,0.12),0.024);
    h.x=x; h.y=y;
  }
  stepFields(dt);

  const p=progs[look]; gl.useProgram(p);
  const s=viewSlice();
  gl.uniform2f(U(p,'uTexel'),1/canvas.width,1/canvas.height);
  gl.uniform2f(U(p,'uSimTexel'),1/SIM_W,1/SIM_H);
  gl.uniform2f(U(p,'uView'),s.w,s.x);
  gl.uniform1f(U(p,'uT'),t); gl.uniform1f(U(p,'uA'),ASPECT);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,wave.read.t); gl.uniform1i(U(p,'uWave'),0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D,trail.read.t); gl.uniform1i(U(p,'uTrail'),1);
  blit(null);
}
resize(); frame();
</script>
</body>
</html>
