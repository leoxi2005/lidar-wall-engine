<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>LiDAR Wall — XOÁY</title>
<style>
  :root { color-scheme: dark; }
  html,body { margin:0; background:#07080c; color:#c8d4e4;
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; }
  .wrap { max-width:1500px; margin:0 auto; padding:18px 20px 40px; }
  h1 { font-size:15px; font-weight:600; letter-spacing:.14em; color:#8fb8dd; margin:0 0 4px; }
  .sub { color:#5d6b80; margin:0 0 16px; }
  canvas { display:block; width:100%; border-radius:6px; background:#000; cursor:crosshair; touch-action:none; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:14px 0 10px; }
  button { font:inherit; color:#b9c9dc; background:#131722; border:1px solid #26304a;
           padding:7px 14px; border-radius:5px; cursor:pointer; }
  button:hover { border-color:#3d5686; color:#e6f0fb; }
  button.on { background:#1d2942; border-color:#5b83c8; color:#eaf3ff; }
  .desc { color:#7e8ea6; margin:12px 0 0; max-width:80ch; }
  .desc b { color:#a9c4e2; font-weight:600; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LiDAR WALL — XOÁY (theo ảnh tham chiếu)</h1>
  <p class="sub">Hàng nghìn sợi mảnh chải theo một dòng chảy đầy xoáy. Quẹt tay là <b>thả xoáy</b>:
    kéo tay qua chất lỏng thì phía sau rụng ra một chuỗi xoáy quay ngược chiều nhau — đúng như
    khuấy nước thật. Giữ chuột và kéo để thử.</p>

  <div class="bar">
    <button data-look="0" class="on">1 · NƯỚC</button>
    <button data-look="1">2 · KHÓI</button>
    <button data-look="2">3 · SAO</button>
    <span style="flex:1"></span>
    <button id="viewBtn">Đang xem: 1 TƯỜNG (560×240)</button>
    <button id="clearBtn">Xoá</button>
  </div>

  <canvas id="c"></canvas>
  <p class="desc" id="desc"></p>
</div>

<script>
const DESCS = [
 '<b>NƯỚC</b> — gần nhất với ảnh bạn gửi: sợi bạc mảnh trên nền xanh đêm, xoáy lớn nhỏ xen nhau, chảy chậm và liên tục. Quẹt tay để lại một chuỗi xoáy chạy dài phía sau rồi tan dần trong khoảng mười giây. Đứng yên thì cả tường vẫn trôi — không bao giờ lặp lại.',
 '<b>KHÓI</b> — cùng dòng chảy nhưng nét dài hơn, mềm hơn, tương phản cao hơn: giống mực loang trong nước hoặc khói dưới đèn. Xoáy đọc rõ hơn từ xa, ít chi tiết vụn hơn khi chiếu lên tường 10 m.',
 '<b>SAO</b> — dòng chảy chở theo hạt sáng. Sợi mờ đi, thay vào đó là hàng nghìn đốm sáng trôi theo xoáy, và <b>mỗi người khuấy ra một màu riêng</b>. Tối nhất, lấp lánh nhất, hợp phòng rất tối.'
];

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { alpha:false, antialias:false });
if (!gl || !gl.getExtension('EXT_color_buffer_float')) {
  document.body.innerHTML = '<p style="padding:40px">Trình duyệt thiếu WebGL2 hoặc float render target.</p>';
}

const ASPECT = 10350/1080, WALL = 560/240;
let viewFull = false, look = 0;

const VS = `#version 300 es
layout(location=0) in vec2 a; out vec2 vUv; uniform vec2 uTexel;
void main(){ vUv=a*0.5+0.5; gl_Position=vec4(a,0.,1.); }`;

// Everything shares one velocity field, evaluated analytically. No velocity simulation:
// the field IS curl noise plus a list of vortices, which is cheaper, never diffuses, and
// gives far cleaner spirals than an advected grid at this resolution.
const FIELD = `
uniform float uT, uA;
uniform vec4 uVort[28];      // xy = centre (wall-heights), z = strength (signed), w = radius
uniform int  uNV;

float h21(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453123); }
float h11(float p){ return fract(sin(p*127.1)*43758.5453123); }
float vn(vec2 x){ vec2 i=floor(x),f=fract(x); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y); }
float fbm(vec2 x){ float s=0.,a=.5; for(int i=0;i<4;i++){ s+=a*vn(x); x*=2.03; a*=.5; } return s; }

// Streamfunction → perpendicular gradient. Taking the CURL means the flow can never have
// sources or sinks, so the strokes never pile up or tear open a hole.
float psi(vec2 p){
  return fbm(p*0.42 + vec2(uT*0.021, uT*0.013))*1.6
       + fbm(p*1.10 - vec2(uT*0.035, 0.0))*0.45;
}
vec2 flow(vec2 p){
  float e = 0.045;
  vec2 v = vec2(psi(p+vec2(0.0,e)) - psi(p-vec2(0.0,e)),
               -(psi(p+vec2(e,0.0)) - psi(p-vec2(e,0.0)))) / (2.0*e);
  v *= 0.20;
  for (int i=0;i<28;i++){
    if (i>=uNV) break;
    vec2 d = p - uVort[i].xy;
    d.x -= round(d.x/uA)*uA;                  // the room wraps
    float r = length(d) + 1e-4;
    float w = uVort[i].z * exp(-(r*r)/(uVort[i].w*uVort[i].w));
    v += vec2(-d.y, d.x)/r * w;               // rotation
    v += d/r * w * 0.16;                      // a little outward push, so it opens up
  }
  return v;
}
`;

function sh(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
function link(vs,fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs));
  gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); return p; }
const prog = f => link(VS,f);
function fbo(w,h){ const t=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA16F,w,h,0,gl.RGBA,gl.HALF_FLOAT,null);
  const f=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,f);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,t,0);
  gl.viewport(0,0,w,h); gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null); return {t,f,w,h}; }
function dbl(w,h){ let a=fbo(w,h),b=fbo(w,h);
  return { get read(){return a;}, get write(){return b;}, swap(){const t=a;a=b;b=t;}, w,h,tx:1/w,ty:1/h }; }
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const vbo=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,vbo);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
function blit(t){ gl.bindVertexArray(vao);
  if(t){ gl.viewport(0,0,t.w,t.h); gl.bindFramebuffer(gl.FRAMEBUFFER,t.f); }
  else { gl.viewport(0,0,canvas.width,canvas.height); gl.bindFramebuffer(gl.FRAMEBUFFER,null); }
  gl.drawArrays(gl.TRIANGLES,0,3); }
const U=(p,n)=>gl.getUniformLocation(p,n);

// ---------------------------------------------------------------- the streak buffer
// THIS is what makes the picture. Each frame the buffer is pushed one small step ALONG
// the flow and faded slightly, then a little fresh static noise is mixed back in. Grain
// that is re-seeded in place and then dragged repeatedly comes out combed into long
// hairs that follow the streamlines — the look in the reference photo. A single-pass
// noise lookup can never do it, because a hair is the HISTORY of a point, not a value.
const BUF_H = 540, BUF_W = Math.round(BUF_H*ASPECT);
const streak = dbl(BUF_W, BUF_H);

const pAdvect = prog(`#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uSrc;
uniform float uDt, uStep, uFade, uSeed, uGrain;
${FIELD}
void main(){
  vec2 p = vec2(vUv.x*uA, vUv.y);
  vec2 v = flow(p);
  // Step back along the flow, in wall-heights, converted to uv.
  vec2 back = vUv - vec2(v.x/uA, v.y) * uDt * uStep;
  back.x = fract(back.x);
  vec4 s = texture(uSrc, back) * uFade;

  // Fresh grain, fixed in space. Seeding in a moving frame would smear into fog instead
  // of resolving into strands.
  float g = h21(floor(vec2(vUv.x*uGrain*uA, vUv.y*uGrain)));
  float sparkle = step(0.965, g) * 1.0 + g*0.22;
  s.r = max(s.r, 0.0) + sparkle*uSeed;
  s.g = s.g*0.995 + length(v)*0.05*uSeed;     // speed, carried along — used for shading
  o = vec4(clamp(s.r,0.0,4.0), s.g, 0.0, 1.0);
}`);

// ---------------------------------------------------------------- display
const DISP_HEAD = `#version 300 es
precision highp float; precision highp sampler2D;
in vec2 vUv; out vec4 o;
uniform sampler2D uStreak;
uniform vec2 uTexel, uBufTexel, uView;
uniform vec4 uHands[8]; uniform vec3 uHandCols[8]; uniform int uN;
${FIELD}
vec2 pano(){ return vec2(uView.y + vUv.x*uView.x, vUv.y); }
`;

const LOOKS = [
// ---- 1. WATER ---------------------------------------------------------------------
DISP_HEAD + `
void main(){
  vec2 uv = pano();
  vec2 p = vec2(uv.x*uA, uv.y);
  float a = texture(uStreak, uv).r;

  // Emboss. Each bristle gets a lit side and a shadowed side, which is what makes the
  // surface look raised and slightly wet instead of like a flat mask.
  vec2 g = vec2(dFdx(a), dFdy(a)) * 150.0;
  vec3 n = normalize(vec3(-g.x, -g.y, 1.0));
  vec3 L = normalize(vec3(-0.38, 0.70, 0.60));
  float lit = dot(n, L);
  float up = max(lit, 0.0);
  float dn = max(-lit, 0.0);

  // Large slow patches of density, so the room has genuinely dark water between the
  // swirls rather than an even carpet of hair.
  float dens = 0.30 + 0.90 * fbm(p*0.30 + vec2(uT*0.012, uT*0.006));
  float hair = smoothstep(0.06, 0.48, a) * dens;

  vec3 dark = vec3(0.006,0.009,0.018);
  vec3 body = vec3(0.085,0.125,0.215);
  vec3 tip  = vec3(0.62,0.72,0.92);

  vec3 c = dark;
  c += body * hair * (0.18 + 1.10*up) * 0.62;
  c += tip  * pow(hair, 2.4) * up * 0.42;
  c -= body * hair * dn * 0.30;                   // the shadowed side of each bristle
  c += body * a * 0.045;

  for(int i=0;i<8;i++){ if(i>=uN) break;
    vec2 d=vec2(uv.x-uHands[i].x, uv.y-uHands[i].y); d.x-=round(d.x); d.x*=uA;
    c += uHandCols[i]*exp(-dot(d,d)*60.0)*0.10; }

  float v=smoothstep(0.0,0.10,vUv.y)*smoothstep(0.0,0.09,1.0-vUv.y);
  o=vec4(pow(clamp(c*mix(1.0,v,0.30),0.0,1.0),vec3(0.96)),1.0);
}`,

// ---- 2. SMOKE ---------------------------------------------------------------------
DISP_HEAD + `
void main(){
  vec2 uv = pano();
  vec4 s = texture(uStreak, uv);
  float a = s.r;

  vec2 g = vec2(dFdx(a), dFdy(a)) * 150.0;
  vec3 n = normalize(vec3(-g.x,-g.y,1.0));
  float lit = clamp(dot(n, normalize(vec3(-0.5,0.6,0.62))),0.0,1.0);
  float rim = pow(clamp(1.0-n.z,0.0,1.0), 2.0);

  float dens = 0.30 + 0.90*fbm(vec2(uv.x*uA,uv.y)*0.26 + uT*0.010);
  float body = smoothstep(0.05, 0.42, a) * dens;
  vec3 c = vec3(0.008,0.012,0.022);
  c += vec3(0.10,0.16,0.30) * body * (0.18 + 1.10*max(lit,0.0)) * 0.42;
  c -= vec3(0.10,0.16,0.30) * body * max(-lit,0.0) * 0.5;
  c += vec3(0.60,0.70,0.92) * rim * body * 0.16;
  c += vec3(0.22,0.34,0.60) * pow(body,3.0) * 0.18;

  for(int i=0;i<8;i++){ if(i>=uN) break;
    vec2 d=vec2(uv.x-uHands[i].x, uv.y-uHands[i].y); d.x-=round(d.x); d.x*=uA;
    float r=length(d);
    c = mix(c, uHandCols[i]*(0.35+1.2*lit)*body, exp(-r*r*9.0)*0.75);
    c += uHandCols[i]*exp(-r*r*90.0)*0.20; }

  float v=smoothstep(0.0,0.10,vUv.y)*smoothstep(0.0,0.09,1.0-vUv.y);
  o=vec4(pow(clamp(c*mix(1.0,v,0.30),0.0,1.0),vec3(0.90)),1.0);
}`,

// ---- 3. STARS ---------------------------------------------------------------------
DISP_HEAD + `
void main(){
  vec2 uv = pano();
  vec4 s = texture(uStreak, uv);
  float a = s.r;

  // Only the brightest tips of the strands survive, so the flow reads as a swarm of
  // points riding it rather than as combed hair.
  float grain = smoothstep(0.22, 0.75, a);
  float glow  = smoothstep(0.02, 0.30, a);

  vec3 base = vec3(0.004,0.008,0.018);
  vec3 col  = vec3(0.55,0.78,1.00);

  float dens = 0.25 + 0.95*fbm(vec2(uv.x*uA,uv.y)*0.30 + uT*0.011);
  vec3 c = base;
  c += col * glow * 0.030 * dens;
  c += col * grain * 0.20 * dens;
  c += vec3(1.0) * pow(grain, 3.0) * 0.11 * dens;

  for(int i=0;i<8;i++){ if(i>=uN) break;
    vec2 d=vec2(uv.x-uHands[i].x, uv.y-uHands[i].y); d.x-=round(d.x); d.x*=uA;
    float r=length(d);
    float near = exp(-r*r*4.5);
    c = mix(c, uHandCols[i]*(grain*2.2 + glow*0.35), near*0.85);
    c += uHandCols[i]*exp(-r*r*120.0)*0.35; }

  float v=smoothstep(0.0,0.10,vUv.y)*smoothstep(0.0,0.09,1.0-vUv.y);
  o=vec4(pow(clamp(c*mix(1.0,v,0.25),0.0,1.0),vec3(0.90)),1.0);
}`
];
const progs = LOOKS.map(prog);

const PARAMS = [
  // Hair length = flow speed × how long a streak survives. Too short and it reads as
  // sand; too long and the swirls smear into ribbons. These land on distinct strands.
  { step: 0.50, fade: 0.953, seed: 0.095, grain: 300 },
  { step: 0.70, fade: 0.966, seed: 0.070, grain: 230 },
  { step: 0.44, fade: 0.946, seed: 0.105, grain: 400 }
];

// ---------------------------------------------------------------- vortices
// Dragging something through a fluid does not make ONE swirl — it sheds a street of them,
// spinning alternately. Copying that is what makes a swipe look like stirring rather than
// smearing, and it is why the reference photo is full of paired eddies.
const MAXV = 28;
let vorts = [];
let spin = 1;
function addVortex(x,y,strength,radius,life){
  vorts.push({ x:x*ASPECT, y, s:strength, r:radius, life, age:0 });
  if (vorts.length > MAXV) vorts.shift();
}
function ambient(){
  addVortex(Math.random(), 0.10+Math.random()*0.80,
            (Math.random()<0.5?-1:1)*(0.09+Math.random()*0.15),
            0.11+Math.random()*0.26, 16+Math.random()*16);
}
for(let i=0;i<20;i++) ambient();

function updateVortices(dt){
  for(const v of vorts){
    v.age += dt;
    // Vortices drift with the flow they sit in — a swirl that stays nailed to one spot
    // reads as a decoration; one that travels reads as part of the water.
    v.x += Math.sin(v.y*2.1 + v.age*0.3)*0.04*dt;
    v.y += Math.cos(v.x*0.7 - v.age*0.25)*0.02*dt;
    v.y = Math.min(0.95, Math.max(0.05, v.y));
  }
  vorts = vorts.filter(v => v.age < v.life);
  if (vorts.length < 20 && Math.random() < dt*2.2) ambient();
}
function packVortices(buf){
  let n = 0;
  for(const v of vorts){
    if (n >= MAXV) break;
    const k = Math.min(1, v.age/0.6) * Math.max(0, 1 - v.age/v.life);   // fade in and out
    buf[n*4] = v.x; buf[n*4+1] = v.y; buf[n*4+2] = v.s*k; buf[n*4+3] = v.r;
    n++;
  }
  return n;
}

// ---------------------------------------------------------------- hands
const PAL=[[0.35,0.85,1.0],[0.60,0.50,1.0],[1.0,0.55,0.75],[1.0,0.80,0.45],[0.50,1.0,0.80]];
const demo=[
  {id:0,cx:0.476,cy:0.55,ax:0.030,ay:0.17,sx:0.33,sy:0.55,ph:0.0,x:0,y:0,first:true,run:0},
  {id:1,cx:0.528,cy:0.42,ax:0.024,ay:0.20,sx:0.57,sy:0.37,ph:2.4,x:0,y:0,first:true,run:0}
];
let mouse=null;
function viewSlice(){ const view=viewFull?ASPECT:WALL, w=view/ASPECT; return {w, x: viewFull?0:0.5-w/2}; }
function toPano(e){ const r=canvas.getBoundingClientRect(), s=viewSlice();
  return { x:s.x+((e.clientX-r.left)/r.width)*s.w, y:1-(e.clientY-r.top)/r.height }; }

function handStir(h, x, y){
  let dx=x-h.x; dx-=Math.round(dx);
  const d=Math.hypot(dx*ASPECT, y-h.y);
  h.run += d;
  // One vortex every ~12 cm of travel, alternating spin: a vortex street.
  if (h.run > 0.035){
    h.run = 0; spin = -spin;
    addVortex(x, y, spin*(0.26 + Math.min(d*36,0.42)), 0.14+Math.random()*0.14, 9+Math.random()*7);
  }
  h.x=x; h.y=y;
}
canvas.addEventListener('pointerdown',e=>{ const p=toPano(e);
  mouse={x:p.x,y:p.y,id:(Math.random()*5)|0,run:0};
  addVortex(p.x,p.y,(Math.random()<0.5?-1:1)*0.38,0.17,10);
  try{canvas.setPointerCapture(e.pointerId);}catch(_){} });
canvas.addEventListener('pointermove',e=>{ if(!mouse) return; const p=toPano(e); handStir(mouse,p.x,p.y); });
window.addEventListener('pointerup',()=>{ mouse=null; });

document.querySelectorAll('[data-look]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('[data-look]').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); look=+b.dataset.look; document.getElementById('desc').innerHTML=DESCS[look]; }));
document.getElementById('viewBtn').addEventListener('click',e=>{ viewFull=!viewFull;
  e.target.textContent=viewFull?'Đang xem: CẢ 5 TƯỜNG (10350×1080)':'Đang xem: 1 TƯỜNG (560×240)'; resize(); });
document.getElementById('clearBtn').addEventListener('click',()=>{ vorts=[]; for(let i=0;i<9;i++) ambient();
  for(const t of [streak.read,streak.write]){ gl.bindFramebuffer(gl.FRAMEBUFFER,t.f);
    gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); } gl.bindFramebuffer(gl.FRAMEBUFFER,null); });
document.getElementById('desc').innerHTML=DESCS[0];

function resize(){ const w=canvas.clientWidth, view=viewFull?ASPECT:WALL;
  const h=Math.round(w/view); canvas.style.height=h+'px';
  const dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr); }
window.addEventListener('resize',resize);

const vbuf=new Float32Array(MAXV*4), hb=new Float32Array(32), cb=new Float32Array(24);
let t0=performance.now(), last=t0;
function frame(){
  requestAnimationFrame(frame); resize();
  const now=performance.now(); const dt=Math.min(Math.max((now-last)/1000,1/240),1/20); last=now;
  const t=(now-t0)/1000;

  const hands=[];
  for(const h of demo){
    const x=(h.cx+h.ax*Math.sin(t*h.sx+h.ph)+1)%1, y=h.cy+h.ay*Math.sin(t*h.sy+h.ph*1.7);
    if(h.first){h.x=x;h.y=y;h.first=false;}
    handStir(h,x,y);
    hands.push({x,y,id:h.id});
  }
  if(mouse) hands.push({x:mouse.x,y:mouse.y,id:mouse.id});

  updateVortices(dt);
  const nv = packVortices(vbuf);
  const P = PARAMS[look];

  // advect
  gl.useProgram(pAdvect);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,streak.read.t); gl.uniform1i(U(pAdvect,'uSrc'),0);
  gl.uniform1f(U(pAdvect,'uT'),t); gl.uniform1f(U(pAdvect,'uA'),ASPECT);
  gl.uniform1f(U(pAdvect,'uDt'),dt); gl.uniform1f(U(pAdvect,'uStep'),P.step);
  gl.uniform1f(U(pAdvect,'uFade'),Math.pow(P.fade, dt*60));
  gl.uniform1f(U(pAdvect,'uSeed'),P.seed); gl.uniform1f(U(pAdvect,'uGrain'),P.grain);
  gl.uniform4fv(U(pAdvect,'uVort'),vbuf); gl.uniform1i(U(pAdvect,'uNV'),nv);
  blit(streak.write); streak.swap();

  // display
  const p=progs[look]; gl.useProgram(p); const s=viewSlice();
  hb.fill(0); cb.fill(0);
  hands.slice(0,8).forEach((h,i)=>{ hb[i*4]=h.x; hb[i*4+1]=h.y; hb[i*4+3]=1;
    const c=PAL[h.id%PAL.length]; cb[i*3]=c[0]; cb[i*3+1]=c[1]; cb[i*3+2]=c[2]; });
  gl.uniform2f(U(p,'uTexel'),1/canvas.width,1/canvas.height);
  gl.uniform2f(U(p,'uBufTexel'),1/BUF_W,1/BUF_H);
  gl.uniform2f(U(p,'uView'),s.w,s.x);
  gl.uniform1f(U(p,'uT'),t); gl.uniform1f(U(p,'uA'),ASPECT);
  gl.uniform4fv(U(p,'uHands'),hb); gl.uniform3fv(U(p,'uHandCols'),cb);
  gl.uniform1i(U(p,'uN'),Math.min(hands.length,8));
  gl.uniform4fv(U(p,'uVort'),vbuf); gl.uniform1i(U(p,'uNV'),nv);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,streak.read.t); gl.uniform1i(U(p,'uStreak'),0);
  blit(null);
}
resize(); frame();
</script>
